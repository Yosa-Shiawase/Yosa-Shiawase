<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Status window: stats and skills of Hitesh Sharma">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c4d"/>
      <stop offset="1" stop-color="#191029"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cbb3ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="560" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#sbg)"/>
  <rect x="12" y="12" width="1176" height="536" rx="14" fill="none" stroke="#e8c46a" stroke-width="3"/>
  <rect x="26" y="26" width="1148" height="508" rx="10" fill="none" stroke="#8f7bd8" stroke-width="1.2"/>
  <g clip-path="url(#card)">
    <rect x="-320" y="0" width="320" height="560" fill="url(#holo)">
      <animate attributeName="x" values="-320;1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="600" y="62" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="26" font-weight="bold" letter-spacing="8" fill="#ffd76a">STATUS WINDOW</text>
  <line x1="300" y1="54" x2="430" y2="54" stroke="#e8c46a" stroke-width="1.5" opacity="0.7"/>
  <line x1="770" y1="54" x2="900" y2="54" stroke="#e8c46a" stroke-width="1.5" opacity="0.7"/>
  <text x="70" y="112" font-family="Trebuchet MS, Verdana, sans-serif" font-size="15" letter-spacing="4" fill="#b9a5ff">STATS</text>
  <rect x="64" y="126" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="155" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">NAME</text>
  <text x="210" y="157" font-size="19" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">HITESH SHARMA <tspan fill="#8a5cf6" font-weight="normal" font-size="16">· Yosa Shiawase</tspan></text>
  <rect x="64" y="184" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="213" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">CLASS</text>
  <text x="210" y="215" font-size="18" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">CSE (AI/ML) → Cyber Analyst</text>
  <rect x="64" y="242" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="271" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">GUILD</text>
  <text x="210" y="273" font-size="18" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">KCC Institute of Technology</text>
  <rect x="64" y="300" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="329" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">MIND</text>
  <text x="210" y="331" font-size="18" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">POTENTIAL <tspan fill="#c9971c">EX</tspan> · ADAPTABILITY <tspan fill="#c9971c">EX</tspan></text>
  <rect x="64" y="358" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="387" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">SPIRIT</text>
  <text x="210" y="389" font-size="18" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">WILLPOWER A+ · LUCK <tspan fill="#d9534f">D</tspan></text>
  <rect x="64" y="416" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="445" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">HP</text>
  <text x="210" y="447" font-size="17" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif"><tspan fill="#d9534f">ERROR</tspan> — sleep not found</text>
  <rect x="64" y="474" width="520" height="46" rx="9" fill="#f7f3ea"/>
  <text x="86" y="503" font-size="13" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">LEVEL</text>
  <text x="210" y="505" font-size="18" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">?? (grinding) · MANA <tspan fill="#c9971c">S+</tspan></text>
  <text x="640" y="112" font-family="Trebuchet MS, Verdana, sans-serif" font-size="15" letter-spacing="4" fill="#b9a5ff">SKILLS</text>
  <text x="640" y="140" font-size="13" letter-spacing="2" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">PASSIVE · ALWAYS ON</text>
  <circle cx="650" cy="163" r="5" fill="#ffd76a"/>
  <text x="668" y="168" font-size="15" font-family="Trebuchet MS, Verdana, sans-serif" fill="#efeaff"><tspan font-weight="bold" fill="#ffffff">TRUE SIGHT</tspan><tspan fill="#cfc3ea"> — spots the bug 30s after asking for help</tspan></text>
  <circle cx="650" cy="201" r="5" fill="#ffd76a"/>
  <text x="668" y="206" font-size="15" font-family="Trebuchet MS, Verdana, sans-serif" fill="#efeaff"><tspan font-weight="bold" fill="#ffffff">SANCTUARY</tspan><tspan fill="#cfc3ea"> — the calm one during deadline week</tspan></text>
  <circle cx="650" cy="239" r="5" fill="#ffd76a"/>
  <text x="668" y="244" font-size="15" font-family="Trebuchet MS, Verdana, sans-serif" fill="#efeaff"><tspan font-weight="bold" fill="#ffffff">DREAMWEAVING</tspan><tspan fill="#cfc3ea"> — 2 AM thoughts → sketches, poems, code</tspan></text>
  <text x="640" y="290" font-size="13" letter-spacing="2" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">ACTIVE · GRINDING</text>
  <circle cx="650" cy="315" r="5" fill="#8a5cf6"/>
  <text x="668" y="320" font-size="15" font-family="Trebuchet MS, Verdana, sans-serif" fill="#efeaff"><tspan font-weight="bold" fill="#ffffff">SKILL PLUNDER</tspan><tspan fill="#cfc3ea"> — looting: RAG · Power BI</tspan></text>
  <circle cx="650" cy="353" r="5" fill="#8a5cf6"/>
  <text x="668" y="358" font-size="15" font-family="Trebuchet MS, Verdana, sans-serif" fill="#efeaff"><tspan font-weight="bold" fill="#ffffff">COGNITIVE OVERDRIVE</tspan><tspan fill="#cfc3ea"> — exam mode, do not disturb</tspan></text>
  <circle cx="650" cy="391" r="5" fill="#8a5cf6"/>
  <text x="668" y="396" font-size="15" font-family="Trebuchet MS, Verdana, sans-serif" fill="#efeaff"><tspan font-weight="bold" fill="#ffffff">AEROMODELING</tspan><tspan fill="#cfc3ea"> — defying gravity, mostly on purpose</tspan></text>
  <line x1="640" y1="446" x2="1140" y2="446" stroke="#8f7bd8" stroke-width="1" opacity="0.5"/>
  <text x="640" y="486" font-size="16" font-style="italic" fill="#b9a5ff" font-family="Georgia, serif">aim. sketch. commit. repeat.</text>
  <text x="1140" y="486" text-anchor="end" font-size="16" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">LV ?? → ↑<animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></text>
</svg>
