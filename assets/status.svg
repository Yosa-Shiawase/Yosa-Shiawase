<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Status window: stats and skills of Hitesh Sharma">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c4d"/>
      <stop offset="1" stop-color="#191029"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cbb3ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="640" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="640" rx="18" fill="url(#sbg)"/>
  <rect x="12" y="12" width="1176" height="616" rx="14" fill="none" stroke="#e8c46a" stroke-width="3"/>
  <rect x="26" y="26" width="1148" height="588" rx="10" fill="none" stroke="#8f7bd8" stroke-width="1.2"/>
  <g clip-path="url(#card)">
    <rect x="-320" y="0" width="320" height="640" fill="url(#holo)">
      <animate attributeName="x" values="-320;1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="600" y="72" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="30" font-weight="bold" letter-spacing="8" fill="#ffd76a">STATUS WINDOW</text>
  <line x1="290" y1="62" x2="420" y2="62" stroke="#e8c46a" stroke-width="1.5" opacity="0.7"/>
  <line x1="780" y1="62" x2="910" y2="62" stroke="#e8c46a" stroke-width="1.5" opacity="0.7"/>
  <text x="940" y="72" font-size="22" fill="#e8c46a">✦<animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></text>

  <text x="70" y="124" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18" letter-spacing="4" fill="#b9a5ff">STATS</text>

  <rect x="64" y="138" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="171" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">NAME</text>
  <text x="195" y="173" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">HITESH SHARMA <tspan fill="#8a5cf6" font-weight="normal" font-size="18">· Yosa Shiawase</tspan></text>

  <rect x="64" y="200" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="233" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">CLASS</text>
  <text x="195" y="235" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">CSE (AI/ML) → Cyber Analyst</text>

  <rect x="64" y="262" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="295" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">GUILD</text>
  <text x="195" y="297" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">KCC Institute of Technology</text>

  <rect x="64" y="324" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="357" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">MIND</text>
  <text x="195" y="359" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">POTENTIAL <tspan fill="#c9971c">EX</tspan> · ADAPTABILITY <tspan fill="#c9971c">EX</tspan></text>

  <rect x="64" y="386" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="419" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">SPIRIT</text>
  <text x="195" y="421" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">WILLPOWER <tspan fill="#c9971c">A+</tspan> · LUCK <tspan fill="#d9534f">D</tspan></text>

  <rect x="64" y="448" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="481" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">HP</text>
  <text x="195" y="483" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif"><tspan fill="#d9534f">ERROR</tspan> — sleep not found</text>

  <rect x="64" y="510" width="540" height="52" rx="9" fill="#f7f3ea"/>
  <text x="86" y="543" font-size="14" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">LEVEL</text>
  <text x="195" y="545" font-size="21" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">?? (grinding) · MANA <tspan fill="#c9971c">S+</tspan></text>

  <text x="640" y="124" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18" letter-spacing="4" fill="#b9a5ff">SKILLS</text>

  <text x="640" y="156" font-size="14" letter-spacing="3" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">PASSIVE · ALWAYS ON</text>
  <circle cx="650" cy="179" r="5.5" fill="#ffd76a"/>
  <text x="668" y="185" font-size="18" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">TRUE SIGHT</text>
  <text x="668" y="209" font-size="16" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">spots the bug 30 s after asking someone for help</text>
  <circle cx="650" cy="235" r="5.5" fill="#ffd76a"/>
  <text x="668" y="241" font-size="18" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">SANCTUARY REFUGE</text>
  <text x="668" y="265" font-size="16" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">the calm one during deadline week</text>
  <circle cx="650" cy="291" r="5.5" fill="#ffd76a"/>
  <text x="668" y="297" font-size="18" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">DREAMWEAVING</text>
  <text x="668" y="321" font-size="16" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">2 AM thoughts → sketches, poems, code</text>

  <text x="640" y="360" font-size="14" letter-spacing="3" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">ACTIVE · GRINDING</text>
  <circle cx="650" cy="383" r="5.5" fill="#8a5cf6"/>
  <text x="668" y="389" font-size="18" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">SKILL PLUNDER</text>
  <text x="668" y="413" font-size="16" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">currently looting: RAG · Power BI</text>
  <circle cx="650" cy="439" r="5.5" fill="#8a5cf6"/>
  <text x="668" y="445" font-size="18" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">COGNITIVE OVERDRIVE</text>
  <text x="668" y="469" font-size="16" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">exam mode — do not disturb</text>
  <circle cx="650" cy="495" r="5.5" fill="#8a5cf6"/>
  <text x="668" y="501" font-size="18" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">AEROMODELING</text>
  <text x="668" y="525" font-size="16" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">defying gravity, mostly on purpose</text>

  <line x1="640" y1="560" x2="1140" y2="560" stroke="#8f7bd8" stroke-width="1" opacity="0.5"/>
  <text x="640" y="596" font-size="18" font-style="italic" fill="#b9a5ff" font-family="Georgia, serif">aim. sketch. commit. repeat.</text>
  <text x="1140" y="596" text-anchor="end" font-size="18" font-weight="bold" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">LV ?? → ↑<animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></text>
</svg>
