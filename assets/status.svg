<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100" role="img" aria-label="Status window: stats and skills of Hitesh Sharma">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c4d"/>
      <stop offset="1" stop-color="#191029"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cbb3ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="760" height="1100" rx="16"/></clipPath>
  </defs>
  <rect width="760" height="1100" rx="16" fill="url(#sbg)"/>
  <rect x="10" y="10" width="740" height="1080" rx="13" fill="none" stroke="#e8c46a" stroke-width="3"/>
  <rect x="22" y="22" width="716" height="1056" rx="9" fill="none" stroke="#8f7bd8" stroke-width="1.2"/>
  <g clip-path="url(#card)">
    <rect x="-240" y="0" width="240" height="1100" fill="url(#holo)">
      <animate attributeName="x" values="-240;760" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="380" y="72" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="34" font-weight="bold" letter-spacing="6" fill="#ffd76a">STATUS WINDOW</text>
  <line x1="88" y1="62" x2="212" y2="62" stroke="#e8c46a" stroke-width="1.5" opacity="0.7"/>
  <line x1="548" y1="62" x2="672" y2="62" stroke="#e8c46a" stroke-width="1.5" opacity="0.7"/>
  <text x="692" y="74" font-size="24" fill="#e8c46a">✦<animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></text>

  <text x="44" y="124" font-family="Trebuchet MS, Verdana, sans-serif" font-size="19" letter-spacing="4" fill="#b9a5ff">STATS</text>

  <rect x="40" y="138" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="173" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">NAME</text>
  <text x="196" y="176" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">HITESH SHARMA <tspan fill="#8a5cf6" font-weight="normal" font-size="18">· Yosa Shiawase</tspan></text>

  <rect x="40" y="202" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="237" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">CLASS</text>
  <text x="196" y="240" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">CSE (AI/ML) → Cyber Analyst</text>

  <rect x="40" y="266" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="301" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">GUILD</text>
  <text x="196" y="304" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">KCC Institute of Technology</text>

  <rect x="40" y="330" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="365" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">MIND</text>
  <text x="196" y="368" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">POTENTIAL <tspan fill="#c9971c">EX</tspan> · ADAPTABILITY <tspan fill="#c9971c">EX</tspan></text>

  <rect x="40" y="394" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="429" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">SPIRIT</text>
  <text x="196" y="432" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">WILLPOWER <tspan fill="#c9971c">A+</tspan> · LUCK <tspan fill="#d9534f">D</tspan></text>

  <rect x="40" y="458" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="493" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">HP</text>
  <text x="196" y="496" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif"><tspan fill="#d9534f">ERROR</tspan> — sleep not found</text>

  <rect x="40" y="522" width="680" height="56" rx="9" fill="#f7f3ea"/>
  <text x="64" y="557" font-size="16" letter-spacing="2" fill="#7a6a95" font-family="Trebuchet MS, Verdana, sans-serif">LEVEL</text>
  <text x="196" y="560" font-size="24" font-weight="bold" fill="#241b3a" font-family="Trebuchet MS, Verdana, sans-serif">?? (grinding) · MANA <tspan fill="#c9971c">S+</tspan></text>

  <text x="44" y="624" font-family="Trebuchet MS, Verdana, sans-serif" font-size="19" letter-spacing="4" fill="#b9a5ff">SKILLS</text>
  <text x="44" y="658" font-size="15" letter-spacing="3" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">PASSIVE · ALWAYS ON</text>

  <circle cx="54" cy="682" r="6" fill="#ffd76a"/>
  <text x="72" y="689" font-size="21" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">TRUE SIGHT</text>
  <text x="72" y="714" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">spots the bug 30 s after asking for help</text>

  <circle cx="54" cy="734" r="6" fill="#ffd76a"/>
  <text x="72" y="741" font-size="21" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">SANCTUARY REFUGE</text>
  <text x="72" y="766" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">the calm one during deadline week</text>

  <circle cx="54" cy="786" r="6" fill="#ffd76a"/>
  <text x="72" y="793" font-size="21" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">DREAMWEAVING</text>
  <text x="72" y="818" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">2 AM thoughts → sketches, poems, code</text>

  <text x="44" y="854" font-size="15" letter-spacing="3" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">ACTIVE · GRINDING</text>

  <circle cx="54" cy="878" r="6" fill="#8a5cf6"/>
  <text x="72" y="885" font-size="21" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">SKILL PLUNDER</text>
  <text x="72" y="910" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">currently looting: RAG · Power BI</text>

  <circle cx="54" cy="930" r="6" fill="#8a5cf6"/>
  <text x="72" y="937" font-size="21" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">COGNITIVE OVERDRIVE</text>
  <text x="72" y="962" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">exam mode — do not disturb</text>

  <circle cx="54" cy="982" r="6" fill="#8a5cf6"/>
  <text x="72" y="989" font-size="21" font-weight="bold" font-family="Trebuchet MS, Verdana, sans-serif" fill="#ffffff">AEROMODELING</text>
  <text x="72" y="1014" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" fill="#cfc3ea">defying gravity, mostly on purpose</text>
<line x1="44" y1="1040" x2="716" y2="1040" stroke="#8f7bd8" stroke-width="1" opacity="0.5"/>
  <text x="44" y="1070" font-size="19" font-style="italic" fill="#b9a5ff" font-family="Georgia, serif">aim. sketch. commit. repeat.</text>
  <text x="716" y="1070" text-anchor="end" font-size="19" font-weight="bold" fill="#ffd76a" font-family="Trebuchet MS, Verdana, sans-serif">LV ?? → ↑<animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></text>
</svg>
