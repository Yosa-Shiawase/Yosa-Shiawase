  <text x="122" y="748" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">SLOT 02</text>
  <text x="122" y="776" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#b9a5ff">locked — level up to unlock</text>

  <rect x="40" y="810" width="480" height="88" rx="10" fill="none" stroke="#8f7bd8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="60" y="852" font-family="Trebuchet MS, Verdana, sans-serif" font-size="26" font-weight="bold" fill="#b9a5ff">???<animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></text>
  <text x="124" y="852" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#b9a5ff">fate has not rendered this quest yet</text>

  <line x1="40" y1="930" x2="520" y2="930" stroke="#8f7bd8" stroke-width="1" opacity="0.5"/>
