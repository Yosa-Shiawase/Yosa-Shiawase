  <text x="104" y="436" font-family="Trebuchet MS, Verdana, sans-serif" font-size="16" fill="#cfc3ea">make something fly that isn't a deadline</text>

  <rect x="40" y="464" width="480" height="88" rx="10" fill="#ffffff" opacity="0.05"/>
  <rect x="40" y="464" width="480" height="88" rx="10" fill="none" stroke="#8f7bd8" stroke-width="1"/>
  <g transform="rotate(-3 73 505)">
    <rect x="60" y="492" width="26" height="26" rx="4" fill="none" stroke="#b9a5ff" stroke-width="2.5"/>
  </g>
  <text x="104" y="489" font-family="Trebuchet MS, Verdana, sans-serif" font-size="12" letter-spacing="3" fill="#b9a5ff">SIDE QUEST</text>
  <text x="104" y="514" font-family="Trebuchet MS, Verdana, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">404 project</text>
