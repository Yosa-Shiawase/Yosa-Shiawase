<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1040" viewBox="0 0 560 1040" role="img" aria-label="Quest log of Hitesh Sharma">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c4d"/>
      <stop offset="1" stop-color="#191029"/>
    </linearGradient>
    <linearGradient id="qholo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cbb3ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="qcard"><rect width="560" height="1040" rx="16"/></clipPath>
  </defs>
  <rect width="560" height="1040" rx="16" fill="url(#qbg)"/>
  <rect x="10" y="10" width="540" height="1020" rx="13" fill="none" stroke="#e8c46a" stroke-width="3"/>
  <rect x="22" y="22" width="516" height="996" rx="9" fill="none" stroke="#8f7bd8" stroke-width="1.2"/>
