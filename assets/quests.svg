  <text x="122" y="676" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#b9a5ff">sealed — a project stirs in the dark</text>

  <rect x="40" y="710" width="480" height="88" rx="10" fill="none" stroke="#8f7bd8" stroke-width="2" stroke-dasharray="10 8"/>
