<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-label="Hitesh Sharma, writing as Yosa Shiawase">
  <rect width="800" height="320" fill="#f6f0e1"/>
  <rect x="30" y="8" width="120" height="26" fill="#e7dcbf" transform="rotate(-4 90 21)"/>
  <rect x="650" y="286" width="120" height="26" fill="#e7dcbf" transform="rotate(-4 710 299)"/>
  <rect x="22" y="22" width="756" height="276" rx="10" fill="none" stroke="#20201e" stroke-width="3" stroke-linecap="round" stroke-dasharray="2080" stroke-dashoffset="2080">
    <animate attributeName="stroke-dashoffset" from="2080" to="0" dur="2.4s" fill="freeze"/>
  </rect>
  <rect x="28" y="28" width="744" height="264" rx="8" fill="none" stroke="#20201e" stroke-width="1.2" opacity="0.5" transform="rotate(0.25 400 160)"/>
  <text x="60" y="122" font-family="'Segoe Print','Bradley Hand',cursive" font-size="70" font-weight="700" fill="#20201e">Yosa Shiawase</text>
  <text x="618" y="122" font-size="70" fill="#8a5cf6" font-family="monospace">_
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="168" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20" letter-spacing="0" fill="#4a463c">HITESH SHARMA · ART · POETRY · ANIME &amp; MANHWA · CODE &amp; EDITING</text>
  <text x="60" y="212" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#6b6557">💫 Just another line committed in the dead of night,</text>
  <text x="60" y="246" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#6b6557">erasing my own shadow so the screen stays bright. 🍃</text>
  <text x="60" y="278" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#8a5cf6">— must. high-five ♡</text>
</svg>
